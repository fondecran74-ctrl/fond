[mypy]
python_version = 3.12
strict = True
plugins =
    mypy_django_plugin.main
    mypy_drf_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = config.settings.development

[mypy-celery.*]
ignore_missing_imports = True

[mypy-kafka.*]
ignore_missing_imports = True

[mypy-casbin.*]
ignore_missing_imports = True
