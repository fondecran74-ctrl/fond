apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ems-ingress
  namespace: ems
  annotations:
    kubernetes.io/ingress.class: kong
spec:
  rules:
    - host: ems.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ems-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ems-frontend
                port:
                  number: 3000
