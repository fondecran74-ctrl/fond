name: CI Backend Security
on:
  push:
    paths: ["backend/**"]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit safety
      - run: cd backend && bandit -r apps/ -c .bandit
      - run: cd backend && safety check -r requirements/base.txt || true
