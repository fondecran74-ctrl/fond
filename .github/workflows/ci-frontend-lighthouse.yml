name: CI Frontend Lighthouse
on:
  pull_request:
    paths: ["frontend/**"]
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: cd frontend && pnpm install && pnpm build
